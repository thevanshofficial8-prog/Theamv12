<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theamv12 • Aesthetic Experience</title>
    <!-- Font Awesome Icons & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Cinzel:wght@500;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #08070d;
            color: #e2e8f0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .cinzel { font-family: 'Cinzel', serif; }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(20, 18, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(192, 132, 252, 0.4);
            transform: translateY(-2px);
        }

        /* Sakura Petal Falling Animation */
        .petal {
            position: fixed;
            background: linear-gradient(135deg, #fbcfe8, #f472b6);
            border-radius: 150% 0 150% 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Soft Floating Effect */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .float-gentle { animation: gentleFloat 4s ease-in-out infinite; }

        /* Glow Effects */
        .ambient-glow {
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.15);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-8 relative">

    <!-- Sakura Petals Container -->
    <div id="sakura-container" class="fixed inset-0 pointer-events-none z-1"></div>

    <!-- Background Space Elements -->
    <img src="earth.png" alt="Earth" class="fixed top-[-50px] left-[-50px] w-48 opacity-20 pointer-events-none z-0 float-gentle" onError="this.style.display='none'">
    <img src="jupiter.png" alt="Jupiter" class="fixed bottom-[-60px] right-[-60px] w-64 opacity-15 pointer-events-none z-0 float-gentle" style="animation-delay: 2s;" onError="this.style.display='none'">

    <!-- Top Navigation Controls -->
    <div class="w-full max-w-2xl flex justify-between items-center z-10 mb-6">
        <div class="glass-panel px-4 py-2 rounded-full text-xs tracking-widest uppercase text-purple-300 font-semibold flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span> Theamv12 Experience
        </div>
        
        <!-- Controls (Sound, Cinema Mode) -->
        <div class="flex gap-2">
            <button onclick="toggleAudio()" id="audio-btn" class="glass-btn w-10 h-10 rounded-full flex items-center justify-center text-purple-300 shadow-lg" title="Toggle Lofi Music">
                <i class="fa-solid fa-music"></i>
            </button>
            <button onclick="toggleCinemaMode()" class="glass-btn w-10 h-10 rounded-full flex items-center justify-center text-pink-300 shadow-lg" title="Cinema Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>

    <!-- Main Card Container -->
    <div id="main-content" class="w-full max-w-2xl glass-panel rounded-3xl p-5 md:p-8 relative z-10 ambient-glow flex flex-col items-center gap-6 transition-all duration-500">
        
        <!-- Profile & Header Section -->
        <div class="flex flex-col items-center text-center gap-3 w-full">
            <div class="relative">
                <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-purple-500 via-pink-500 to-indigo-500 float-gentle shadow-xl">
                    <img src="profile.jpg" onError="this.src='face.jpg'" class="w-full h-full rounded-full object-cover">
                </div>
                <span class="absolute bottom-1 right-1 bg-emerald-500 w-4 h-4 rounded-full border-2 border-gray-900" title="Online"></span>
            </div>

            <div>
                <h1 class="cinzel text-2xl md:text-3xl font-bold tracking-wider text-white">Theamv12</h1>
                <p class="text-xs text-purple-300/80 tracking-widest uppercase mt-1">Peaceful Vibes & Aesthetic Edits</p>
            </div>
        </div>

        <!-- AMV Video Player Container -->
        <div class="w-full rounded-2xl overflow-hidden glass-panel p-1.5 shadow-2xl relative">
            <video id="amv-video" class="w-full rounded-xl object-cover max-h-[420px]" autoplay loop muted playsinline controls>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support video tag.
            </video>
        </div>

        <!-- Aesthetic Quote Display Box -->
        <div class="w-full glass-panel rounded-2xl p-4 text-center border border-purple-500/20">
            <p id="quote-text" class="italic text-sm text-purple-100/90 font-light">"In the quietness of the mind, peace is found."</p>
            <button onclick="newQuote()" class="mt-3 text-[11px] uppercase tracking-widest text-purple-400 hover:text-purple-200 transition flex items-center justify-center gap-1.5 mx-auto">
                <i class="fa-solid fa-sparkles"></i> New Aesthetic Quote
            </button>
        </div>

        <!-- Links & Media Buttons -->
        <div class="w-full flex flex-col gap-3">
            <a href="In another life, this may have been..." target="_blank" class="glass-btn w-full py-3.5 px-5 rounded-2xl font-semibold text-center text-sm text-purple-200 flex items-center justify-center gap-3">
                <i class="fa-solid fa-heart text-pink-400"></i> Explore AMV Collection
            </a>
            <button onclick="sharePage()" class="glass-btn w-full py-3 px-5 rounded-2xl font-semibold text-center text-xs text-gray-300 flex items-center justify-center gap-2">
                <i class="fa-solid fa-share-nodes"></i> Share Peaceful Vibe
            </button>
        </div>
    </div>

    <!-- Hidden Ambient Lofi Audio -->
    <audio id="bg-lofi" loop preload="none">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mp3">
    </audio>

    <!-- Footer -->
    <footer class="w-full max-w-2xl text-center py-6 text-xs text-gray-500 z-10 tracking-wider">
        © 2026 Theamv12 • Curated with Peace by Vansh
    </footer>

    <!-- Interactive Script -->
    <script>
        // Sakura Petals Generator
        const sakuraContainer = document.getElementById('sakura-container');
        for (let i = 0; i < 22; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (Math.random() * 5 + 6) + 's';
            petal.style.animationDelay = (Math.random() * 5) + 's';
            petal.style.width = (Math.random() * 8 + 8) + 'px';
            petal.style.height = (Math.random() * 12 + 10) + 'px';
            sakuraContainer.appendChild(petal);
        }

        // Lofi Audio Controller
        const audio = document.getElementById('bg-lofi');
        const audioBtn = document.getElementById('audio-btn');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                audioBtn.classList.remove('text-pink-400');
                audioBtn.classList.add('text-purple-300');
            } else {
                audio.play();
                audioBtn.classList.remove('text-purple-300');
                audioBtn.classList.add('text-pink-400');
            }
            isPlaying = !isPlaying;
        }

        // Aesthetic Quotes List
        const quotes = [
            "\"In the quietness of the mind, peace is found.\"",
            "\"Lost in memories that feel like music.\"",
            "\"Soft rain, late nights, and quiet thoughts.\"",
            "\"Where words fail, the music speaks.\"",
            "\"In another life, maybe things were different.\"",
            "\"Peace is not silence, but harmony in chaos.\""
        ];

        function newQuote() {
            const random = Math.floor(Math.random() * quotes.length);
            const quoteEl = document.getElementById('quote-text');
            quoteEl.style.opacity = '0';
            setTimeout(() => {
                quoteEl.textContent = quotes[random];
                quoteEl.style.opacity = '1';
            }, 200);
        }

        // Cinema Mode Toggle
        let cinema = false;
        function toggleCinemaMode() {
            const content = document.getElementById('main-content');
            cinema = !cinema;
            if(cinema) {
                content.style.transform = "scale(1.02)";
                document.body.style.background = "#020204";
            } else {
                content.style.transform = "scale(1)";
                document.body.style.background = "#08070d";
            }
        }

        // Share Link Function
        function sharePage() {
            if (navigator.share) {
                navigator.share({ title: 'Theamv12', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("✨ Link copied to clipboard!");
            }
        }
    </script>
</body>
</html>
